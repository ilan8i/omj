name: sync-gitee

# 每次推送到 GitHub 后，把当前分支的快照同步到 Gitee（OMJHelper 的自动更新源）。
# Gitee 是「单提交发布源」：不推送完整历史，而是基于 Gitee 当前分支新建一个
# 内容与 GitHub 一致的快照提交，这样可以 fast-forward，更新体积也只有变更部分。
#
# 需要在仓库 Secrets 中配置：
#   GITEE_TOKEN    Gitee 私人令牌（必填，勾选 projects 权限）
#   GITEE_USERNAME Gitee 用户名（可选，默认 ialn8i）
# Gitee 仓库：https://gitee.com/ialn8i/omj.git

on:
  push:
  workflow_dispatch:

concurrency:
  group: sync-gitee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Push snapshot to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning title=Gitee 同步未配置::请在仓库 Secrets 中添加 GITEE_TOKEN（Gitee 私人令牌），然后重新运行本工作流"
            exit 0
          fi

          user="${GITEE_USERNAME:-ialn8i}"
          remote="https://${user}:${GITEE_TOKEN}@gitee.com/ialn8i/omj.git"

          # Gitee 上已有的分支头，作为新快照提交的父提交
          remote_head=$(timeout 60 git ls-remote --heads "${remote}" "refs/heads/${BRANCH}" | cut -f1)
          if [ -n "${remote_head}" ]; then
            timeout 90 git fetch --depth=1 "${remote}" "refs/heads/${BRANCH}"
            parent=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "${parent}^{tree}")" = "$(git rev-parse HEAD^{tree})" ]; then
              echo "Gitee 已是相同内容，无需同步"
              exit 0
            fi
            parent_args=(-p "${parent}")
          else
            echo "Gitee 上不存在分支 ${BRANCH}，将创建快照根提交"
            parent_args=()
          fi

          # 沿用 GitHub 提交的作者信息，避免额外的署名
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an)"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"

          message=$(mktemp)
          git log -1 --format=%B > "${message}"
          commit=$(git commit-tree "HEAD^{tree}" "${parent_args[@]}" -F "${message}")

          echo "Syncing ${BRANCH} -> ${commit:0:8} (parent: ${parent:-<root>})"
          timeout 180 git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 \
            push "${remote}" "${commit}:refs/heads/${BRANCH}"
