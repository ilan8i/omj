name: sync-gitee

# 每次推送到 GitHub 后，把当前分支同步到 Gitee（OMJHelper 的自动更新源）。
# 需要在仓库 Secrets 中配置：
#   GITEE_TOKEN    Gitee 私人令牌（必填，勾选 projects 权限）
#   GITEE_USERNAME Gitee 用户名（可选，默认 ialn8i）
# Gitee 仓库：https://gitee.com/ialn8i/omj.git

on:
  push:
  workflow_dispatch:

concurrency:
  group: sync-gitee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push branch to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning title=Gitee 同步未配置::请在仓库 Secrets 中添加 GITEE_TOKEN（Gitee 私人令牌），然后重新运行本工作流"
            exit 0
          fi

          user="${GITEE_USERNAME:-ialn8i}"
          branch="${GITHUB_REF_NAME}"
          remote="https://${user}:${GITEE_TOKEN}@gitee.com/ialn8i/omj.git"

          echo "Syncing branch '${branch}' to gitee.com/ialn8i/omj"
          # 强制推送，保证 Gitee 与 GitHub 完全一致
          git push --force "${remote}" "HEAD:refs/heads/${branch}"
